spring.application.name=akivnah-services
server.port=8080

# Database (file-based H2 for quick start; switch to PostgreSQL/MySQL for production)
spring.datasource.url=jdbc:h2:file:./data/akivnah;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Data lives in the file ./data/akivnah.mv.db and survives restarts.
# To browse it: start with H2_CONSOLE=true, sign in as admin, open /h2-console
#   JDBC URL: jdbc:h2:file:./data/akivnah;AUTO_SERVER=TRUE   user: sa   password: (empty)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# JWT - set JWT_SECRET (min 32 characters) in every real environment
akivnah.jwt.secret=${JWT_SECRET:change-this-akivnah-dev-secret-key-at-least-32-chars}
akivnah.jwt.expiration-minutes=60
akivnah.jwt.cookie-secure=${COOKIE_SECURE:false}

# First admin user created on first start - change immediately
akivnah.admin.username=${ADMIN_USERNAME:admin}
akivnah.admin.email=${ADMIN_EMAIL:hr@akivnah.com}
akivnah.admin.password=${ADMIN_PASSWORD:Admin@12345}

# Public address of the site, used in password-reset links (set PUBLIC_URL in production, e.g. https://www.akivnah.com)
akivnah.public-url=${PUBLIC_URL:http://localhost:8080}

# ---------------- Mail ----------------
# Sending (SMTP). Leave unset to disable external sending; internal mail between portal users always works.
# Set via environment variables (or uncomment): SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
#   spring.mail.host=smtp.example.com
#   spring.mail.port=587
#   spring.mail.username=hello@akivnah.com
#   spring.mail.password=app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
akivnah.mail.from=${MAIL_FROM:}
akivnah.mail.outbox-poll-ms=30000

# Receiving (IMAP): fetches unread mail from one company mailbox and files it into the portal user whose email matches the recipient.
akivnah.mail.imap.enabled=${IMAP_ENABLED:false}
akivnah.mail.imap.host=${IMAP_HOST:}
akivnah.mail.imap.port=${IMAP_PORT:993}
akivnah.mail.imap.username=${IMAP_USERNAME:}
akivnah.mail.imap.password=${IMAP_PASSWORD:}
akivnah.mail.imap.default-user=${akivnah.admin.username}
akivnah.mail.imap.poll-ms=60000

# Attachments (5 MB per file, 12 MB per request)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Change password')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <div class="panel">
    <h2>Change password</h2>
    <div class="alert bad" th:if="${param.required}">You must choose a new password before you continue.</div>
    <div class="alert bad" th:if="${error}" th:text="${error}">error</div>
    <form th:action="@{/account/password}" method="post">
      <label for="currentPassword">Current password</label>
      <input type="password" id="currentPassword" name="currentPassword" required autocomplete="current-password" autofocus>
      <label for="password">New password</label>
      <input type="password" id="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" maxlength="72" autocomplete="new-password">
      <p class="muted">8 to 72 characters. You will be signed out everywhere and asked to sign in again.</p>
      <p><button class="btn" type="submit">Change password</button></p>
    </form>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>

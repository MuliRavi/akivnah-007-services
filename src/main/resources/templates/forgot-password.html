<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Forgot password')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <div class="panel">
    <h2>Forgot your password?</h2>
    <div class="alert ok" th:if="${param.sent}">If that account exists, we have sent a reset link. It works once and expires in 30 minutes. Check your email.</div>
    <p class="muted">Enter your username or the email address on your account.</p>
    <form th:action="@{/forgot-password}" method="post">
      <label for="identifier">Username or email</label>
      <input type="text" id="identifier" name="identifier" required autofocus maxlength="150">
      <p><button class="btn" type="submit">Send reset link</button></p>
    </form>
    <p><a th:href="@{/login}">Back to sign in</a></p>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>

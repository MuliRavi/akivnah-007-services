<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('New increment letter')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <p><a th:href="@{/hr/employees/{id}(id=${employee.id})}">&larr; Back</a></p>
  <h1>Increment letter &ndash; <span th:text="${employee.fullName}">Name</span></h1>
  <div class="panel wide">
    <p class="muted">Saving updates the employee's current CTC (and designation, if you enter a new one).</p>
    <form th:action="@{/hr/employees/{id}/increments(id=${employee.id})}" th:object="${increment}" method="post">
      <div class="cols">
        <div><label>Issue date</label><input type="date" th:field="*{issueDate}"><div class="error" th:errors="*{issueDate}"></div></div>
        <div><label>Effective date</label><input type="date" th:field="*{effectiveDate}"><div class="error" th:errors="*{effectiveDate}"></div></div>
        <div><label>Current annual CTC (INR)</label><input type="number" step="0.01" th:field="*{oldCtc}"><div class="error" th:errors="*{oldCtc}"></div></div>
        <div><label>Revised annual CTC (INR)</label><input type="number" step="0.01" th:field="*{newCtc}"><div class="error" th:errors="*{newCtc}"></div></div>
        <div><label>New designation (optional)</label><input type="text" th:field="*{newDesignation}"><div class="error" th:errors="*{newDesignation}"></div></div>
        <div><label>Remarks (optional)</label><input type="text" th:field="*{remarks}"><div class="error" th:errors="*{remarks}"></div></div>
        <div><label>Signatory name</label><input type="text" th:field="*{signatoryName}"><div class="error" th:errors="*{signatoryName}"></div></div>
        <div><label>Signatory title</label><input type="text" th:field="*{signatoryTitle}"><div class="error" th:errors="*{signatoryTitle}"></div></div>
      </div>
      <p><button class="btn" type="submit">Generate increment letter</button></p>
    </form>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <div class="panel">
    <h2>Create account</h2>
    <form th:action="@{/register}" th:object="${form}" method="post">
      <label for="username">Username</label>
      <input type="text" id="username" th:field="*{username}">
      <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
      <label for="email">Email</label>
      <input type="email" id="email" th:field="*{email}">
      <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      <label for="password">Password</label>
      <input type="password" id="password" th:field="*{password}">
      <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" th:field="*{confirmPassword}">
      <div class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
      <p><button class="btn" type="submit">Register</button></p>
    </form>
    <p>Already registered? <a th:href="@{/login}">Sign in</a></p>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>

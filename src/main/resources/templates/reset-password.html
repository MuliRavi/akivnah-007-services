<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Reset password')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
  <div class="panel">
    <h2>Choose a new password</h2>
    <div class="alert bad" th:unless="${valid}">This reset link is invalid, already used, or expired. <a th:href="@{/forgot-password}">Request a new one</a>.</div>
    <form th:if="${valid}" th:action="@{/reset-password}" method="post">
      <div class="alert bad" th:if="${error}" th:text="${error}">error</div>
      <input type="hidden" name="token" th:value="${token}">
      <label for="password">New password</label>
      <input type="password" id="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password" autofocus>
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" maxlength="72" autocomplete="new-password">
      <p class="muted">8 to 72 characters.</p>
      <p><button class="btn" type="submit">Change password</button></p>
    </form>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
